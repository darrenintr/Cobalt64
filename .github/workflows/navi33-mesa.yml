name: RADV for macOS (Navi33 / Navi48 Darwin backend)

# Builds Mesa's RADV (libvulkan_radeon.dylib, x86_64) from the pinned upstream commit plus
# mesa-patches/*.patch, the user-space half of the N48N native ABI that the Navi33 and Navi48
# kexts serve. Not boot-tested here: the artifact is what the Metal bundle ships.
on:
  push:
    branches: ['feature/navi33-*']
    paths:
      - 'mesa-patches/**'
      - 'tools/native/navi33metal/**'
      - 'tools/native/navi48metal/**'
      - 'tools/native/navi48accel/**'
      - 'tools/native/ioaccel-layout/**'
      - 'third-party/metal2vulkan-n48/**'
      - '.github/workflows/navi33-mesa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radv:
    runs-on: macos-15-intel
    env:
      MESA_COMMIT: f5cb8ee032adabef599ae892ec4e42d796b84da9
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja pkg-config bison flex glslang || true
          python3 -m pip install --break-system-packages mako pyyaml packaging
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Mesa at the pinned commit plus our patches
        run: |
          git init -q mesa && cd mesa
          git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch -q --depth 1 origin "$MESA_COMMIT"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@example.invalid am -q ../mesa-patches/*.patch
          git log --oneline | head -12
      - name: Configure
        working-directory: mesa
        run: |
          meson setup build --buildtype=release \
            -Dvulkan-drivers=amd -Dgallium-drivers= -Dplatforms= \
            -Dllvm=disabled -Dopengl=false -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dzstd=disabled -Dexpat=disabled -Dvalgrind=disabled -Dlibunwind=disabled -Dbuild-tests=false -Dspirv-tools=disabled
      - name: Build libvulkan_radeon
        working-directory: mesa
        run: |
          ninja -C build src/amd/vulkan/libvulkan_radeon.dylib
          file build/src/amd/vulkan/libvulkan_radeon.dylib
          # Only system libraries may remain: the guest has no Homebrew.
          otool -L build/src/amd/vulkan/libvulkan_radeon.dylib | tee /dev/stderr | tail -n +2 | \
            awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/|@rpath/libvulkan_radeon)' && { echo "non-system dependency" >&2; exit 1; } || true
          nm -gU build/src/amd/vulkan/libvulkan_radeon.dylib | grep -E 'vk_icdGetInstanceProcAddr|radv_darwin_' | head
      - name: Package
        run: |
          mkdir -p out
          cp mesa/build/src/amd/vulkan/libvulkan_radeon.dylib out/
          cp mesa/build/src/amd/vulkan/radeon_icd.*.json out/ 2>/dev/null || true
          (cd mesa && git log --oneline | head -12) > out/mesa-commits.txt
          shasum -a 256 out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: radv-darwin-x86_64
          path: out/

  experimental-metal-bridge:
    needs: radv
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: radv-darwin-x86_64
          path: .ci-radv
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: .ci-vulkan-headers
      - name: Fetch kernel SDK
        run: git clone --depth 1 --recurse-submodules https://github.com/somestupidgirl/RDNA4FB.git /tmp/RDNA4FB
      - name: Install Rust for the pinned AIR translator
        run: |
          brew install rust
          cargo --version
          rustc --version
      - name: Build and validate auxiliary accelerator (no installation)
        # navi48accel needs the reverse-engineered IOAcceleratorFamily2 layout
        # in tools/native/ioaccel-layout, which is not committed to this repo.
        # Skip (do not fail the workflow) until that data is added, so the
        # experimental Metal bridge below still gets a real CI signal.
        run: |
          if [ -d tools/native/ioaccel-layout/generated ]; then
            make -C tools/native/navi48accel MKSDK=/tmp/RDNA4FB/MacKernelSDK all
          else
            echo "::warning title=navi48accel skipped::tools/native/ioaccel-layout not committed; aux accelerator not built"
          fi
      - name: Build the experimental gfx1102-capable Metal bridge (no registration)
        env:
          N33_RADV_LIB: ${{ github.workspace }}/.ci-radv/libvulkan_radeon.dylib
          N33_VK_INC: -I${{ github.workspace }}/.ci-vulkan-headers/include
          N33_BRIDGE_OUTPUT_DIR: ${{ runner.temp }}/navi33-metal-bridge
        run: bash tools/native/navi33metal/build-bridge.sh
      - name: Package the matching auxiliary accelerator
        run: |
          mkdir -p "$RUNNER_TEMP/navi33-metal-bridge"
          if [ -e tools/native/navi48accel/build/Navi48Accel.kext ]; then
            tar --no-xattrs --no-mac-metadata \
              -C tools/native/navi48accel/build \
              -cf "$RUNNER_TEMP/navi33-metal-bridge/Navi48Accel-x86_64.tar" Navi48Accel.kext
          else
            echo "::warning title=aux accelerator not packaged::Navi48Accel.kext absent (navi48accel skipped)"
          fi
          cp third-party/metal2vulkan-n48/NOTICE third-party/metal2vulkan-n48/COPYING \
            "$RUNNER_TEMP/navi33-metal-bridge/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/navi33-metal-bridge/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: navi33-experimental-metal-bridge-macos-26-intel
          path: ${{ runner.temp }}/navi33-metal-bridge/
          if-no-files-found: error
          retention-days: 30
